kind = "web"
previewPath = "/"
title = "Temple Project Intelligence"
version = "1.0.0"
id = "artifacts/temple-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20451

[services.development]
run = "pnpm --filter @workspace/temple-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/temple-tracker", "run", "build" ]
publicDir = "artifacts/temple-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20451"
BASE_PATH = "/"
