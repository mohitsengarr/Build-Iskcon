# Bhaktigram Matrix — nginx reverse proxy for Synapse.
#
# Replace MATRIX_HOST everywhere with your chosen subdomain, e.g. chat.buildiskcon.com.
# This host is PERMANENT — it becomes part of every user/room ID (@x:MATRIX_HOST) and
# cannot be changed without starting the server over. Decide it before `generate`.
#
# Obtain TLS for MATRIX_HOST first (certbot --nginx -d MATRIX_HOST, or Caddy auto-TLS).
# A Caddy equivalent is in README.md.

server {
    listen 443 ssl http2;
    server_name MATRIX_HOST;

    # --- TLS (certbot fills these in, or point them at your certs) ---
    ssl_certificate     /etc/letsencrypt/live/MATRIX_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/MATRIX_HOST/privkey.pem;

    # Matrix media + reasonable upload ceiling (text-only today; raises headroom).
    client_max_body_size 50M;

    # Client–server API + Synapse client resources -> Synapse.
    # Synapse already sends permissive CORS (Access-Control-Allow-Origin: *) on
    # /_matrix/client/*, so the Vercel web app and the RN app can call it directly.
    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host               $host;
        proxy_read_timeout 600s;            # /sync is a long-poll; don't cut it early
    }

    # ADMIN API — never expose to the public internet. Allow only your IP(s)
    # (and the moderation UI host). Everyone else gets 403.
    location /_synapse/admin {
        allow 127.0.0.1;
        # allow YOUR.OFFICE.IP.HERE;
        deny all;
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host               $host;
    }

    # Optional: let Synapse serve its own .well-known with correct CORS.
    # (Not strictly needed — our clients hardcode baseUrl=https://MATRIX_HOST —
    #  but harmless and useful if you ever point a generic Matrix client here.)
    location /.well-known/matrix {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name MATRIX_HOST;
    return 301 https://$host$request_uri;
}
